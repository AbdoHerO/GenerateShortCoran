<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Scene library test</title>
<style>
  @font-face { font-family: "Tajawal"; src: url(../fonts/Tajawal-Medium.ttf) format("truetype"); font-weight: 500; }
  @font-face { font-family: "Tajawal"; src: url(../fonts/Tajawal-Bold.ttf) format("truetype"); font-weight: 700; }
  @font-face { font-family: "Tajawal"; src: url(../fonts/Tajawal-ExtraBold.ttf) format("truetype"); font-weight: 800; }
  @font-face { font-family: "Montserrat"; src: url(../fonts/Montserrat-SemiBold.ttf) format("truetype"); font-weight: 600; }
  html, body { margin: 0; background: #222; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="960" height="870"></canvas>
<script type="module">
  import { scenes, _debug } from '../js/scenes_lib.js';
  import { drawMotifs, MOTIF_IDS } from '../js/motifs.js';
  window.MOTIF_IDS = MOTIF_IDS;
  // synthetic timeline: verses 1..3, 8 words each, 0.5 s per word, 0.6 s pause between verses
  function fakeT(scene, params, o = {}) {
    const start = o.start ?? 0, verses = o.verses ?? [1, 2, 3], wpv = o.wpv ?? 8, dur = o.dur ?? 0.5;
    const words = [];
    let t = start + 0.3;
    const vs = new Map(), ve = new Map();
    for (const n of verses) {
      vs.set(n, t);
      for (let p = 1; p <= wpv; p++) { const pause = p === wpv || p === 4; words.push({ n, p, s: t, e: t + dur * 0.9, pause }); t += dur + (pause ? 0.35 : 0); }
      ve.set(n, t); t += 0.6;
    }
    const end = t + 0.3;
    const seg = (n, p) => words.find((w) => w.n === n && w.p === p);
    const T = {
      c: { id: 'test', title: '', scene, params, verses, start, end, bg: '#eee' },
      start, end, words,
      v: (n) => vs.get(n) ?? NaN, ve: (n) => ve.get(n) ?? NaN,
      w: (n, p) => seg(n, p)?.s ?? NaN, we: (n, p) => seg(n, p)?.e ?? NaN,
      at: (ref) => { if (!Array.isArray(ref)) return start; const v = seg(ref[0], ref[1])?.s; return Number.isFinite(v) ? v : start; },
    };
    return T;
  }
  const off = new OffscreenCanvas(960, 870), ox = off.getContext('2d');
  window.drawAt = (scene, params, t, o) => {
    const T = fakeT(scene, params, o);
    const t0 = performance.now();
    ox.save(); ox.setTransform(1, 0, 0, 1, 0, 0); ox.clearRect(0, 0, 960, 870);
    scenes[scene].draw(ox, t, T);
    ox.restore();
    ox.save(); ox.setTransform(1, 0, 0, 1, 0, 0); drawMotifs(ox, t, T, params); ox.restore();
    if (window.flush) ox.getImageData(0, 0, 1, 1);   // force rasterisation so the timing is real
    const ms = performance.now() - t0;
    const an = scenes[scene].anchors(t, T);
    return { ms, an };
  };
  window.camAt = (scene, params, times, o) => { const T = fakeT(scene, params, o); return times.map((t) => { const c = _debug.cam(scene, t, T); return [t, +c.x.toFixed(1), +c.y.toFixed(1), +c.z.toFixed(3)]; }); };
  window.timeline = (o) => { const T = fakeT('stage', {}, o); return { start: T.start, end: T.end, words: T.words.map((w) => [w.n, w.p, +w.s.toFixed(2), w.pause ? 1 : 0]) }; };
  // grid sheet: cases = [{scene, params, t, label, o}]
  window.sheet = async (cases, cols = 3, scale = 0.4, showAnchors = true) => {
    const tw = Math.round(960 * scale), th = Math.round(870 * scale);
    const rows = Math.ceil(cases.length / cols);
    const cv = document.getElementById('c');
    cv.width = cols * tw + (cols + 1) * 6; cv.height = rows * (th + 26) + 6;
    const cx = cv.getContext('2d');
    cx.fillStyle = '#222'; cx.fillRect(0, 0, cv.width, cv.height);
    const timings = [];
    for (let i = 0; i < cases.length; i++) {
      const k = cases[i];
      const r = window.drawAt(k.scene, k.params, k.t, k.o);
      timings.push({ label: k.label, ms: r.ms });
      const x = 6 + (i % cols) * (tw + 6), y = 6 + Math.floor(i / cols) * (th + 26);
      cx.drawImage(off, x, y, tw, th);
      if (showAnchors) {
        for (const [name, [ax, ay]] of Object.entries(r.an)) {
          if (!Number.isFinite(ax) || !Number.isFinite(ay)) { timings.push({ label: k.label + ' BAD ANCHOR ' + name }); continue; }
          cx.fillStyle = '#ff2d55'; cx.beginPath(); cx.arc(x + ax * scale, y + ay * scale, 3.5, 0, Math.PI * 2); cx.fill();
          cx.font = '600 10px Montserrat'; cx.fillStyle = '#ff2d55'; cx.fillText(name, x + ax * scale + 5, y + ay * scale + 3);
        }
      }
      cx.fillStyle = '#ffd34d'; cx.font = '600 13px Montserrat'; cx.fillText(`${k.label}  t=${k.t}  ${r.ms.toFixed(1)}ms`, x + 4, y + th + 17);
    }
    return timings;
  };
  await document.fonts.load('800 24px "Tajawal"', 'ا');
  await document.fonts.load('700 15px "Tajawal"', 'ا');
  await document.fonts.load('600 13px "Montserrat"', 'A');
  window.done = true;
</script>
</body>
</html>
